name: Extract and Render Thank You Video
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Remotion project
        run: |
          unzip -o terima-kasih-remotion.zip -d .
          test -f package.json
          test -f src/Root.tsx
          test -d public/logos
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Render video
        run: npm run render
      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: terima-kasih-mp4
          path: out/terima-kasih.mp4
          if-no-files-found: error

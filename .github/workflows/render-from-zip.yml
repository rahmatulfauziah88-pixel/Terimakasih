name: Extract and Render Thank You Video
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Remotion project
        run: |
          unzip -o terima-kasih-remotion.zip -d .
          test -f package.json
          test -f src/Root.tsx
          test -d public/logos
      - name: Inspect five-logo package and Remotion composition
        run: |
          echo "=== LOGO ZIP CONTENTS ==="
          unzip -l 5_logo_transparan.zip
          echo "=== CURRENT LOGO ASSETS ==="
          find public/logos -maxdepth 2 -type f -printf '%p\n' | sort
          echo "=== REMOTION SOURCE FILES ==="
          find src -maxdepth 3 -type f -printf '%p\n' | sort
          echo "=== ROOT COMPOSITION ==="
          sed -n '1,260p' src/Root.tsx
          echo "=== LOGO REFERENCES ==="
          grep -RniE 'logo|vendor|Rifa|JOI|Heniyuda|Syafa' src --include='*.tsx' --include='*.ts' || true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Render video
        run: npm run render
      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: terima-kasih-mp4
          path: out/terima-kasih.mp4
          if-no-files-found: error
